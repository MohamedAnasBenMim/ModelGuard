[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelguard"
version = "1.0.0"
description = "Production-style fraud training, registry, serving, drift, and retraining platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.32"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8"]

[project.scripts]
modelguard-train = "modelguard.cli:train"
modelguard-benchmark = "modelguard.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=modelguard --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["src/modelguard/api.py", "src/modelguard/cli.py", "src/modelguard/benchmark.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
